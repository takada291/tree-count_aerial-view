<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樹頂検知</title>

    <!-- ★ リポジトリ内にモデルファイルがあれば優先使用し、無ければ本家サーバーへフォールバックするフック -->
    <script>
      (function() {
        function getLocalTarget(url) {
          if (typeof url !== 'string') return null;
          if (url.includes('model.json')) {
            return './model.json';
          }
          const binMatch = url.match(/group1-shard\d+of\d+\.bin/);
          if (binMatch) {
            return './' + binMatch[0];
          }
          return null;
        }

        const originalFetch = window.fetch;
        window.fetch = async function(input, init) {
          const url = (typeof input === 'string') ? input : (input && input.url ? input.url : '');
          const localUrl = getLocalTarget(url);

          if (localUrl) {
            try {
              const localRes = await originalFetch.call(this, localUrl, init);
              if (localRes.ok) {
                return localRes;
              }
            } catch (e) {
              // リポジトリに無い場合は本家へフォールバック
            }
          }
          return originalFetch.call(this, input, init);
        };
      })();
    </script>
    <!-- リポジトリ内の roboflow.js を優先し、無ければ公式CDNから読み込む -->
    <script src="./roboflow.js"></script>
    <script>
      if (typeof window.roboflow === 'undefined') {
        document.write('<script src="https://cdn.roboflow.com/0.2.26/roboflow.js"><\/script>');
      }
    </script>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WXBP6CPKLP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WXBP6CPKLP');
    </script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px; background: #e8f5e9; color: #333; margin: 0; padding-bottom: 40px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .header-area { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2e7d32; margin-bottom: 10px; padding-bottom: 5px; }
        h2 { margin: 0; font-size: 1.1em; color: #1b5e20; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; font-size: 0.95rem; cursor: pointer; text-align: center; width: 100%; margin-bottom: 10px; box-sizing: border-box;}
        .btn-primary { background: #1565c0; color: white; }
        .btn-success { background: #2e7d32; color: white; }
        .btn-warning { background: #f57f17; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-teal { background: #00897b; color: white; }
        
        .btn:disabled { background: #bdbdbd !important; cursor: not-allowed; }

        .controls { display: flex; gap: 10px; margin-bottom: 10px; }
        .controls .btn { margin-bottom: 0; }

        .input-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .input-row label { font-weight: bold; font-size: 0.9em; color: #1b5e20; width: 35%; }
        .input-row select { width: 63%; padding: 8px; border: 1px solid #81c784; border-radius: 4px; font-size: 0.95rem; background: white; }

        #canvas-container { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 250px;}
        canvas { max-width: 100%; max-height: 75vh; height: auto; touch-action: none; display: block; }

        .summary-box { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: #f1f8e9; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 1.1em; color: #1b5e20; }
        .stat { display: flex; justify-content: space-between; padding: 5px 10px; background: white; border-radius: 6px; border: 1px solid #c5e1a5;}
        .stat-s { color: #2e7d32; }
        .stat-r { color: #c62828; }
        .stat-w { color: #616161; }
        .stat-total { color: #1565c0; grid-column: span 2; }
        
        .mode-text { font-size: 0.85em; color: #d32f2f; margin-bottom: 10px; font-weight: bold; text-align: center;}

        .main-layout { display: flex; flex-direction: column; gap: 15px; }
        @media (min-width: 900px) {
            .main-layout { flex-direction: row; align-items: flex-start; }
            .left-panel { flex: 1; min-width: 0; }
            .right-panel { flex: 0 0 350px; display: flex; flex-direction: column; gap: 15px; }
            .right-panel .card { margin-bottom: 0; }
            #canvas-container { min-height: 500px; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-area">
        <h2>🌲 樹頂検知アプリ V2.7 <span style="font-size:0.75em; color:#666;">(内蔵AI・6回推論版)</span></h2>
    </div>
    <div id="statusMsg" style="font-size:0.9em; margin-bottom: 5px; color: #1565c0; font-weight: bold;">写真を選択して検知ボタンを押してください</div>
</div>

<div class="main-layout">
    <div class="left-panel">
        <div class="card" style="margin-bottom:0; height:100%; display:flex; flex-direction:column;">
            <div id="modeMessage" class="mode-text" style="display:none;">画像をクリックして頂点を追加し、始点をクリックして囲みを閉じます</div>
            <div id="canvas-container" style="flex-grow:1;">
                <canvas id="viewCanvas"></canvas>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="card">
            <label class="btn btn-secondary" style="display:block;">
                📸 写真を選択
                <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="loadImage(event)">
            </label>

            <button class="btn btn-teal" id="btnLoadModel" onclick="loadRoboflowModel()">📥 認識モデル読込</button>

            <div class="input-row">
                <label>🎯 検出感度</label>
                <select id="rfThresholdSelect">
                    <option value="0.25">甘め・多め (25%以上)</option>
                    <option value="0.40" selected>標準バランス (40%以上)</option>
                    <option value="0.60">厳しめ・確実 (60%以上)</option>
                </select>
            </div>

            <button id="btnDetect" class="btn btn-success" style="margin-bottom:0;" onclick="runDetection()" disabled>⚡ 内蔵AI検知スタート (6回推論)</button>
        </div>

        <div class="card">
            <div class="controls">
                <button id="btnMode" class="btn btn-warning" onclick="toggleMode()">⬡ 多角形モード: OFF</button>
                <button class="btn btn-secondary" onclick="resetSelection()">🔄 範囲リセット</button>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-top:0; font-size: 1rem; color:#1b5e20;">📊 検知結果</h3>
            <div class="summary-box">
                <div class="stat stat-s"><span>スギ (s):</span> <span id="countS">0</span></div>
                <div class="stat stat-r"><span>赤枯 (r):</span> <span id="countR">0</span></div>
                <div class="stat stat-w"><span>枯死 (w):</span> <span id="countW">0</span></div>
                <div class="stat stat-total"><span>合計:</span> <span id="countTotal">0</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // ★ 内蔵AIモデル（Roboflow）設定（内部上限5000本）
    // ==========================================
    const PROJECT_NAME = "treetopcount"; 
    const RF_API_KEY = "rf_sRyNyDbysrbVYyp2FNCslDCxdpN2"; 
    const MODEL_VERSION = 22;
    const MAX_OBJECTS_LIMIT = 5000; // カウント上限5000本
    // ==========================================

    let imgElement = new Image();
    let treeModel = null;
    let predictionsData = [];
    
    const canvas = document.getElementById('viewCanvas');
    const ctx = canvas.getContext('2d');
    
    const btnDetect = document.getElementById('btnDetect');
    const btnMode = document.getElementById('btnMode');
    const statusMsg = document.getElementById('statusMsg');
    
    let isSelectionMode = false;
    let polygonPoints = [];
    let mousePos = null;
    let isPolygonClosed = false;

    function loadImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            imgElement.onload = function() {
                canvas.width = imgElement.width;
                canvas.height = imgElement.height;
                ctx.drawImage(imgElement, 0, 0);
                predictionsData = [];
                resetSelection();
                updateCounts();
                btnDetect.disabled = false;
                
                statusMsg.innerText = "「内蔵AI検知スタート」ボタンを押してください";
                statusMsg.style.color = "#2e7d32";
            }
            imgElement.src = e.target.result;
        }
        reader.readAsDataURL(file);
        event.target.value = '';
    }

    function applyRoboflowConfig() {
        if (!treeModel) return;
        const selectedThreshold = parseFloat(document.getElementById('rfThresholdSelect')?.value) || 0.40;
        try {
            treeModel.configure({
                threshold: selectedThreshold,
                overlap: 0.50,
                max_objects: MAX_OBJECTS_LIMIT
            });
        } catch (e) {
            console.log("Roboflow configure warning:", e);
        }
    }

    async function loadRoboflowModel() {
        const btn = document.getElementById('btnLoadModel');
        btn.disabled = true;
        btn.innerText = "⏳ モデル読込中...";
        statusMsg.innerText = "認識モデルを読み込んでいます...";
        statusMsg.style.color = "#1565c0";
        
        try {
            const rf = await window.roboflow.auth({ publishable_key: RF_API_KEY });
            treeModel = await rf.load({ model: PROJECT_NAME, version: MODEL_VERSION });
            applyRoboflowConfig();
            
            btn.innerText = "✅ 認識モデル準備完了";
            btn.style.background = "#388e3c"; 
            statusMsg.innerText = "認識モデルの準備が完了しました。";
            statusMsg.style.color = "#2e7d32";
        } catch (error) {
            alert("モデル読込失敗: " + error.message);
            statusMsg.innerText = "モデル読込エラーが発生しました";
            statusMsg.style.color = "#d32f2f";
            btn.disabled = false;
            btn.innerText = "📥 認識モデル読込";
        }
    }

    // ★ 画像の反転・明暗バリエーションを生成するキャンバス関数
    function getVariationCanvas(img, flip, brightness) {
        const tmpCanvas = document.createElement('canvas');
        tmpCanvas.width = img.width;
        tmpCanvas.height = img.height;
        const tmpCtx = tmpCanvas.getContext('2d');

        if (brightness !== 100) {
            tmpCtx.filter = `brightness(${brightness}%)`;
        }

        if (flip) {
            tmpCtx.translate(tmpCanvas.width, 0);
            tmpCtx.scale(-1, 1);
        }

        tmpCtx.drawImage(img, 0, 0);

        if (brightness !== 100) {
            tmpCtx.filter = 'none';
        }

        return tmpCanvas;
    }

    function normalizePredictions(rawPreds, isFlipped, imgWidth) {
        return rawPreds.map(p => {
            const rawX = p.bbox ? p.bbox.x : p.x;
            const rawY = p.bbox ? p.bbox.y : p.y;
            const rawW = p.bbox ? p.bbox.width : p.width;
            const rawH = p.bbox ? p.bbox.height : p.height;
            return {
                class: p.class,
                confidence: p.confidence,
                x: isFlipped ? (imgWidth - rawX) : rawX,
                y: rawY,
                width: rawW,
                height: rawH
            };
        });
    }

    function calculateIoU(box1, box2) {
        const x1 = Math.max(box1.x - box1.width / 2, box2.x - box2.width / 2);
        const y1 = Math.max(box1.y - box1.height / 2, box2.y - box2.height / 2);
        const x2 = Math.min(box1.x + box1.width / 2, box2.x + box2.width / 2);
        const y2 = Math.min(box1.y + box1.height / 2, box2.y + box2.height / 2);

        if (x2 <= x1 || y2 <= y1) return 0.0;

        const intersectionArea = (x2 - x1) * (y2 - y1);
        const box1Area = box1.width * box1.height;
        const box2Area = box2.width * box2.height;
        const unionArea = box1Area + box2Area - intersectionArea;

        return intersectionArea / unionArea;
    }

    // ボーナス追加方式（ヒノキ除外付き）
    function mergeNewPredictions(basePreds, newPreds, iouThreshold = 0.45) {
        let combined = [...basePreds];

        for (let newBox of newPreds) {
            if (newBox.class === 'h') continue;

            let isDuplicate = false;
            for (let baseBox of combined) {
                if (newBox.class === baseBox.class && calculateIoU(newBox, baseBox) > iouThreshold) {
                    isDuplicate = true;
                    break;
                }
            }
            if (!isDuplicate) {
                combined.push(newBox);
            }
        }
        return combined;
    }

    // ★ 内蔵AIによる6回推論（標準・反転・明暗）メイン処理
    async function runDetection() {
        if(!imgElement.src) return;
        btnDetect.disabled = true;

        const variations = [
            { flip: false, brightness: 100, label: "標準" },
            { flip: true,  brightness: 100, label: "反転" },
            { flip: false, brightness: 130, label: "明(130%)" },
            { flip: true,  brightness: 130, label: "反転+明" },
            { flip: false, brightness:  70, label: "暗(70%)" },
            { flip: true,  brightness:  70, label: "反転+暗" }
        ];

        let finalPredictions = [];

        try {
            if (!treeModel) {
                btnDetect.innerText = "⏳ モデル準備中...";
                statusMsg.innerText = "認識モデルを読み込んでいます...";
                const rf = await window.roboflow.auth({ publishable_key: RF_API_KEY });
                treeModel = await rf.load({ model: PROJECT_NAME, version: MODEL_VERSION });
                const loadBtn = document.getElementById('btnLoadModel');
                loadBtn.innerText = "✅ 認識モデル準備完了";
                loadBtn.style.background = "#388e3c";
                loadBtn.disabled = true;
            }

            applyRoboflowConfig();

            for (let i = 0; i < variations.length; i++) {
                const v = variations[i];
                btnDetect.innerText = `⏳ 推論中... (${i+1}/6) [${v.label}]`;
                statusMsg.innerText = `内蔵AIで高速推論中... (${i+1}/6: ${v.label})`;
                await new Promise(r => setTimeout(r, 30)); // UI描画更新用

                const varCanvas = getVariationCanvas(imgElement, v.flip, v.brightness);
                const rawPreds = await treeModel.detect(varCanvas);
                const adjustedPreds = normalizePredictions(rawPreds, v.flip, imgElement.width);

                if (i === 0) {
                    // 1回目（標準）をベースとして確定（ヒノキは除外）
                    finalPredictions = adjustedPreds.filter(p => p.class !== 'h');
                } else {
                    // 2回目以降は新発見の木のみをボーナス加算
                    finalPredictions = mergeNewPredictions(finalPredictions, adjustedPreds, 0.45);
                }
            }

            predictionsData = finalPredictions;
            
            drawCanvas();
            updateCounts();
            
            btnDetect.innerText = "✅ 検知完了 (再実行)";
            statusMsg.innerText = `✅ 6回推論完了！合計 ${predictionsData.length} 本を検出しました。`;
            statusMsg.style.color = "#2e7d32";
        } catch(e) {
            alert("AI検知エラー: " + e.message);
            btnDetect.innerText = "⚡ 内蔵AI検知スタート (6回推論)";
            statusMsg.innerText = "エラーが発生しました: " + e.message;
            statusMsg.style.color = "#d32f2f";
            console.error(e);
        }
        btnDetect.disabled = false;
    }

    function drawCanvas() {
        if(!imgElement.src) return;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(imgElement, 0, 0);
        
        predictionsData.forEach(p => {
            const boxColor = getColorForClass(p.class);
            const cx = p.x;
            const cy = p.y;
            const w = p.width;
            const h = p.height;
            const x = cx - w / 2;
            const y = cy - h / 2;
            
            let alpha = 1.0;
            if (isPolygonClosed && polygonPoints.length >= 3) {
                if (!isInsidePolygon(cx, cy, polygonPoints)) {
                    alpha = 0.2;
                }
            }

            ctx.globalAlpha = alpha;
            ctx.strokeStyle = boxColor;
            ctx.lineWidth = Math.max(2, canvas.width / 500);
            ctx.strokeRect(x, y, w, h);
            
            ctx.fillStyle = boxColor;
            const fontSize = Math.max(12, canvas.width / 60);
            ctx.font = `bold ${fontSize}px Arial`;
            
            const text = `${p.class}`;
            const textWidth = ctx.measureText(text).width;
            ctx.fillRect(x, y - fontSize - 4, textWidth + 4, fontSize + 4);
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(text, x + 2, y - 4);
        });
        
        ctx.globalAlpha = 1.0;

        if (polygonPoints.length > 0) {
            ctx.strokeStyle = '#f57f17';
            ctx.lineWidth = Math.max(3, canvas.width / 300);
            
            ctx.beginPath();
            ctx.moveTo(polygonPoints[0].x, polygonPoints[0].y);
            for(let i = 1; i < polygonPoints.length; i++) {
                ctx.lineTo(polygonPoints[i].x, polygonPoints[i].y);
            }
            
            if (isPolygonClosed) {
                ctx.closePath();
                ctx.fillStyle = 'rgba(245, 127, 23, 0.2)';
                ctx.fill();
            } else if (mousePos) {
                ctx.lineTo(mousePos.x, mousePos.y); 
            }
            
            ctx.setLineDash([10, 10]);
            ctx.stroke();
            ctx.setLineDash([]);
            
            polygonPoints.forEach((pt, index) => {
                ctx.beginPath();
                const radius = (index === 0 && !isPolygonClosed) ? Math.max(8, canvas.width/200) : Math.max(4, canvas.width/400);
                ctx.arc(pt.x, pt.y, radius, 0, 2*Math.PI);
                ctx.fillStyle = (index === 0 && !isPolygonClosed) ? 'rgba(245, 127, 23, 0.8)' : '#f57f17';
                ctx.fill();
            });
        }
    }

    function getColorForClass(className) {
        if (className === 's') return '#2e7d32'; 
        if (className === 'r') return '#c62828'; 
        if (className === 'w') return '#616161'; 
        return '#1565c0'; 
    }

    function updateCounts() {
        let countS = 0, countR = 0, countW = 0;
        
        predictionsData.forEach(p => {
            const cx = p.x;
            const cy = p.y;
            
            if (isPolygonClosed && polygonPoints.length >= 3) {
                if (!isInsidePolygon(cx, cy, polygonPoints)) return;
            }
            
            if (p.class === 's') countS++;
            else if (p.class === 'r') countR++;
            else if (p.class === 'w') countW++;
        });

        document.getElementById('countS').innerText = countS;
        document.getElementById('countR').innerText = countR;
        document.getElementById('countW').innerText = countW;
        document.getElementById('countTotal').innerText = countS + countR + countW;
    }

    function toggleMode() {
        isSelectionMode = !isSelectionMode;
        if (isSelectionMode) {
            btnMode.innerText = "⬡ 多角形モード: ON";
            btnMode.classList.remove('btn-warning');
            btnMode.classList.add('btn-primary');
            document.getElementById('modeMessage').style.display = 'block';
        } else {
            btnMode.innerText = "⬜ 多角形モード: OFF";
            btnMode.classList.add('btn-warning');
            btnMode.classList.remove('btn-primary');
            document.getElementById('modeMessage').style.display = 'none';
        }
    }

    function resetSelection() {
        polygonPoints = [];
        isPolygonClosed = false;
        mousePos = null;
        drawCanvas();
        updateCounts();
    }

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        let clientX = e.clientX;
        let clientY = e.clientY;
        
        if(e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }

        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    function isInsidePolygon(x, y, points) {
        let isInside = false;
        for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
            let xi = points[i].x, yi = points[i].y;
            let xj = points[j].x, yj = points[j].y;
            let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
            if (intersect) isInside = !isInside;
        }
        return isInside;
    }

    canvas.addEventListener('click', (e) => {
        if (!isSelectionMode || !imgElement.src) return;
        
        const pt = getMousePos(e);
        
        if (isPolygonClosed) {
            polygonPoints = [pt];
            isPolygonClosed = false;
        } else {
            if (polygonPoints.length >= 3) {
                const dx = pt.x - polygonPoints[0].x;
                const dy = pt.y - polygonPoints[0].y;
                const hitRadius = 30 * (canvas.width / canvas.getBoundingClientRect().width); 
                
                if (Math.sqrt(dx*dx + dy*dy) < hitRadius) {
                    isPolygonClosed = true;
                    drawCanvas();
                    updateCounts();
                    return;
                }
            }
            polygonPoints.push(pt);
        }
        drawCanvas();
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isSelectionMode || isPolygonClosed || polygonPoints.length === 0) return;
        mousePos = getMousePos(e);
        drawCanvas();
    });

    // 過去に登録されたService Workerがあれば自動解除する（PCブラウザ用）
    window.addEventListener('load', () => {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister(); 
                }
            });
        }
    });
</script>
</body>
</html>
